# Publica la aplicación de la Entrega 4 (la carpeta app/) en GitHub Pages.
#
# No reconstruye la app: publica el app/index.html que ya está commiteado, que es el que se
# generó con app/build_app.py y se verificó contra el notebook. Así lo publicado es exactamente
# lo que se revisó.
#
# Requisito, una sola vez: repositorio público y Settings → Pages → Source: «GitHub Actions».
name: Publicar la app en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: despliegue
        uses: actions/deploy-pages@v4
